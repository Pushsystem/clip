<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>HaoWoo clip</title>
<style>
@font-face{font-family:K;font-weight:500;src:url(assets/kanit1.ttf)}
@font-face{font-family:K;font-weight:700;src:url(assets/kanit2.ttf)}
@font-face{font-family:K;font-weight:900;src:url(assets/kanit3.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff4e6}
body{font-family:K,'Noto Color Emoji',sans-serif;color:#3b2314;position:relative}
.abs{position:absolute}
#bg{inset:0;background:radial-gradient(1200px 900px at 50% 30%,#fffaf2 0%,#ffe9d2 55%,#f7cfa8 100%)}
.blob{border-radius:50%;filter:blur(2px);opacity:.35}
.stripe{inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 40px,transparent 40px 80px)}
.card{border-radius:44px;overflow:hidden;box-shadow:0 30px 70px rgba(90,40,10,.35);border:10px solid #fff;background:#fff}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.pigc{border-radius:50%;overflow:hidden;border:10px solid #f5b301;box-shadow:0 18px 50px rgba(120,50,0,.4);background:#fff}
.pigc img{width:100%;height:100%;display:block}
.cap{left:40px;width:880px;top:1170px;text-align:center}
.cap .l{display:inline-block;font-weight:900;line-height:1.25;padding:6px 26px 14px;border-radius:26px;margin:8px 0}
.cap .l1{font-size:72px;color:#fff;-webkit-text-stroke:0;text-shadow:0 6px 0 #3b2314,4px 0 0 #3b2314,-4px 0 0 #3b2314,0 -4px 0 #3b2314,4px 4px 0 #3b2314,-4px 4px 0 #3b2314,4px -4px 0 #3b2314,-4px -4px 0 #3b2314,0 14px 24px rgba(0,0,0,.25)}
.cap .l2{white-space:nowrap;font-size:58px;color:#fff;background:#ff2d87;box-shadow:0 10px 0 #b8005a,0 18px 30px rgba(0,0,0,.25)}
.tag{background:#3b2314;color:#fff;font-weight:700;font-size:44px;padding:10px 30px 16px;border-radius:999px;white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.tag b{color:#ffd23f}
.chip{display:flex;align-items:center;gap:22px;background:#fff;border-radius:34px;padding:18px 34px 22px;box-shadow:0 14px 0 #e8b98c,0 24px 40px rgba(90,40,10,.25);font-weight:700;font-size:52px;white-space:nowrap}
.chip .e{font-size:70px}
.chip .v{margin-left:auto;background:#ff2d87;color:#fff;border-radius:22px;padding:2px 22px 8px;font-weight:900}
.stat{width:400px;height:250px;background:#fff;border-radius:36px;box-shadow:0 14px 0 #e8b98c,0 24px 40px rgba(90,40,10,.25);display:flex;flex-direction:column;align-items:center;justify-content:center}
.stat .e{font-size:72px;line-height:1}
.stat .v{font-weight:900;font-size:66px;color:#e8174f;line-height:1.2}
.stat .k{font-weight:500;font-size:36px;line-height:1.1}
.handle{white-space:nowrap;font-weight:700;font-size:40px;color:#3b2314;background:rgba(255,255,255,.9);padding:6px 26px 10px 110px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.15)}
#gauge text{font-family:K}
.arrow{font-size:170px;line-height:1}
.cart{background:linear-gradient(#ff4f9b,#ff2d87);color:#fff;font-weight:900;font-size:66px;padding:20px 50px 30px;border-radius:999px;box-shadow:0 14px 0 #b8005a,0 26px 40px rgba(0,0,0,.3);white-space:nowrap}
</style></head>
<body>
<div id="bg" class="abs"></div>
<div class="abs stripe"></div>
<div id="blobs"></div>
<div id="stage" class="abs" style="inset:0"></div>
<div id="cap" class="abs cap"></div>
<!-- persistent channel badge -->
<div id="badge" class="abs" style="left:46px;top:150px">
  <div class="abs handle" style="left:40px;top:38px">@อู๊ดอี๊ดเอาจริง</div>
  <div id="mini" class="abs pigc" style="left:0;top:0;width:130px;height:130px;border-width:7px"><img src="assets/pig.webp"></div>
</div>
<div id="prog" class="abs" style="left:0;top:0;height:10px;background:#ff2d87"></div>

<script>
const TL = TIMELINE_JSON;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.9;x=clamp(x);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const spring=(t,t0,d=.45)=>t<t0?0:back((t-t0)/d);
const el=(html)=>{const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild};
const S=document.getElementById('stage'), C=document.getElementById('cap');

// background blobs
const B=document.getElementById('blobs');
const blobs=[[120,520,260,'#ffb3d1'],[930,420,200,'#ffd77a'],[860,1500,320,'#ffc1a1'],[160,1700,240,'#ffd77a'],[560,860,380,'#fff']];
blobs.forEach(([x,y,r,c])=>B.appendChild(el(`<div class="abs blob" style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;background:${c}"></div>`)));

// ---------- scene builders: each returns {root, update(t, local, env)} ----------
const scenes={
hook(){
  const r=el(`<div class="abs" style="inset:0">
    <div class="abs card" id="hk" style="left:520px;top:330px;width:480px;height:640px"><img src="assets/angle.jpg" style="object-position:50% 40%"></div>
    <div class="abs pigc" id="hp" style="left:60px;top:360px;width:560px;height:560px"><img src="assets/pig.webp"></div>
    <div class="abs" id="stop" style="left:640px;top:250px;font-size:150px;font-weight:900;color:#ff2d87;transform-origin:center">✋</div>
  </div>`);
  return {root:r,update(t,l,e){
    const p=spring(l,0.05,.55), k=spring(l,.5,.6);
    r.querySelector('#hp').style.transform=`scale(${p*(1+e*.07)}) rotate(${-6+Math.sin(l*9)*e*4}deg)`;
    r.querySelector('#hk').style.transform=`translateX(${(1-k)*700}px) rotate(${8-2*Math.sin(l*2)}deg)`;
    const s=spring(l,.25,.4); r.querySelector('#stop').style.transform=`scale(${s}) rotate(${Math.sin(l*18)*8*clamp(1.5-l)}deg)`;
  }};
},
intro(){
  const r=el(`<div class="abs" style="inset:0">
    <div class="abs card" id="ic" style="left:150px;top:300px;width:700px;height:860px"><img id="ii" src="assets/front.jpg" style="object-position:50% 35%"></div>
    <div class="abs tag" id="t1" style="left:600px;top:420px">คอห่าน <b>ดริปแม่น</b></div>
    <div class="abs tag" id="t2" style="left:60px;top:760px">ด้าม<b>ลายไม้</b></div>
    <div class="abs tag" id="t3" style="left:520px;top:1010px;background:#ff2d87">สไตล์<b style="color:#fff">วินเทจ</b> ✨</div>
  </div>`);
  return {root:r,update(t,l,e){
    const p=spring(l,0,.55);
    r.querySelector('#ic').style.transform=`scale(${.6+.4*p}) rotate(${-3+3*p}deg)`;
    r.querySelector('#ii').style.transform=`scale(${1.05+l*.02})`;
    [['#t1',1.1],['#t2',2.0],['#t3',3.0]].forEach(([id,a])=>{const s=spring(l,a,.4);r.querySelector(id).style.transform=`scale(${s}) rotate(${(id=='#t2'?-4:4)*s}deg)`});
  }};
},
temp(){
  const gid='g'+Math.random().toString(36).slice(2);
  const r=el(`<div class="abs" style="inset:0">
    <svg id="gauge" class="abs" style="left:140px;top:300px" width="800" height="800" viewBox="0 0 800 800">
      <defs><linearGradient id="${gid}" x1="0" x2="1"><stop offset="0" stop-color="#5ab0ff"/><stop offset=".55" stop-color="#ffb02e"/><stop offset="1" stop-color="#ff2d55"/></linearGradient></defs>
      <circle cx="400" cy="400" r="330" fill="#fff" stroke="#f3d9c0" stroke-width="10"/>
      <path id="trk" d="" fill="none" stroke="#f1e4d6" stroke-width="56" stroke-linecap="round"/>
      <path id="arc" d="" fill="none" stroke="url(#${gid})" stroke-width="56" stroke-linecap="round"/>
      <text id="num" x="400" y="450" text-anchor="middle" font-size="230" font-weight="900" fill="#3b2314">40</text>
      <text x="400" y="540" text-anchor="middle" font-size="64" font-weight="700" fill="#ff2d87">°C</text>
      <text x="170" y="690" text-anchor="middle" font-size="48" font-weight="700" fill="#5ab0ff">40°</text>
      <text x="630" y="690" text-anchor="middle" font-size="48" font-weight="700" fill="#ff2d55">100°</text>
    </svg>
    <div class="abs card" id="led" style="left:700px;top:840px;width:300px;height:300px;border-radius:50%;border-color:#3b2314"><img src="assets/params.jpg" style="width:450%;height:450%;object-fit:cover;object-position:0 0;transform:translate(-3%,-77%)"></div>
  </div>`);
  const cx=400,cy=400,R=270,a0=150,a1=390;
  const pt=a=>[cx+R*Math.cos(a*Math.PI/180),cy+R*Math.sin(a*Math.PI/180)];
  const arc=(f)=>{const a=a0+(a1-a0)*Math.max(f,.001);const [x0,y0]=pt(a0),[x1,y1]=pt(a);return `M${x0} ${y0} A${R} ${R} 0 ${a-a0>180?1:0} 1 ${x1} ${y1}`};
  r.querySelector('#trk').setAttribute('d',arc(1));
  return {root:r,setTemp(v){r.querySelector('#arc').setAttribute('d',arc((v-40)/60));r.querySelector('#num').textContent=Math.round(v)},
  update(t,l,e){
    const p=spring(l,0,.5); r.querySelector('#gauge').style.transform=`scale(${p})`;
    this.setTemp(40+60*eo(lin(l,1.6,3.4)));
    const s=spring(l,.6,.45); r.querySelector('#led').style.transform=`scale(${s}) rotate(${-10+10*s}deg)`;
  }};
},
drinks(){
  const g=scenes.temp(); const r=g.root;
  r.querySelector('#led').style.display='none';
  r.querySelector('#gauge').style.left='190px';r.querySelector('#gauge').style.top='250px';
  r.querySelector('#gauge').setAttribute('width',700);r.querySelector('#gauge').setAttribute('height',700);
  const list=[['☕','กาแฟดริป',92,.15],['🍵','ชาเขียวญี่ปุ่น',80,1.55],['🍼','นมลูกน้อย',45,2.6]];
  const chips=list.map(([e,n,v],i)=>{const c=el(`<div class="abs chip" style="left:120px;width:840px;top:${930+i*0}px"><span class="e">${e}</span>${n}<span class="v">${v}°C</span></div>`);r.appendChild(c);return c});
  return {root:r,update(t,l,e){
    r.querySelector('#gauge').style.transform='scale(1)';
    let v=100;
    list.forEach(([_,__,val,a],i)=>{
      const prev=i?list[i-1][2]:100; if(l>=a) v=prev+(val-prev)*eo(lin(l,a,a+.6));
      const s=spring(l,a,.4), nxt=list[i+1]?list[i+1][3]:99;
      const out=lin(l,nxt-.05,nxt+.3);
      const c=chips[i]; c.style.opacity=l<a?0:1-out; c.style.transform=`translateY(${(1-s)*120-out*80}px) scale(${.7+.3*s})`;
    });
    const last=chips[2]; if(l>2.6) last.style.opacity=1;
    g.setTemp(v);
  }};
},
specs(){
  const items=[['⚡','1200W','เดือดไว'],['💧','0.9 ลิตร','ความจุ'],['🥄','สแตนเลส 304','ด้านใน'],['✅','Food Grade','ปลอดภัย']];
  const r=el(`<div class="abs" style="inset:0"></div>`);
  const pos=[[120,350],[560,350],[120,635],[560,635]];
  const cards=items.map(([e,v,k],i)=>{const c=el(`<div class="abs stat" style="left:${pos[i][0]}px;top:${pos[i][1]}px"><div class="e">${e}</div><div class="v" style="${v.length>8?'font-size:52px':''}">${v}</div><div class="k">${k}</div></div>`);r.appendChild(c);return c});
  const ph=el(`<div class="abs card" style="left:350px;top:915px;width:380px;height:230px;border-radius:36px"><img src="assets/angle.jpg" style="object-position:50% 45%"></div>`);r.appendChild(ph);
  const at=[.1,1.2,2.2,3.4];
  return {root:r,update(t,l,e){cards.forEach((c,i)=>{const s=spring(l,at[i],.4);c.style.transform=`scale(${s}) rotate(${(i%2?3:-3)*(1-s)}deg)`});
    const s=spring(l,.4,.5); ph.style.transform=`translateY(${(1-s)*400}px)`; ph.style.opacity=clamp(s*2)}};
},
keep(){
  const r=el(`<div class="abs" style="inset:0">
    <div class="abs card" id="kp" style="left:110px;top:300px;width:520px;height:700px"><img src="assets/front.jpg" style="object-position:50% 40%"></div>
    <div class="abs stat" id="k1" style="left:560px;top:360px;width:420px;height:280px"><div class="e">🌡️</div><div class="v" style="font-size:54px">คงที่ยาวๆ</div><div class="k">รักษาอุณหภูมิ</div></div>
    <div class="abs stat" id="k2" style="left:560px;top:700px;width:420px;height:280px"><div class="e">⏰</div><div class="v" style="font-size:54px">ตั้งเวลา</div><div class="k">ต้มล่วงหน้าได้</div></div>
    <div class="abs" id="sun" style="left:420px;top:880px;font-size:180px">🌅</div>
  </div>`);
  return {root:r,update(t,l,e){
    const p=spring(l,0,.5); r.querySelector('#kp').style.transform=`translateX(${(1-p)*-600}px) rotate(${-3}deg)`;
    r.querySelector('#k1').style.transform=`scale(${spring(l,.3,.4)})`;
    r.querySelector('#k2').style.transform=`scale(${spring(l,1.6,.4)})`;
    const s=spring(l,3.2,.5); r.querySelector('#sun').style.transform=`scale(${s}) translateY(${Math.sin(l*4)*8}px)`;
  }};
},
safe(){
  const r=el(`<div class="abs" style="inset:0">
    <div class="abs" id="sh" style="left:340px;top:250px;font-size:400px;line-height:1">🛡️</div>
    <div class="abs chip" id="s1" style="left:120px;top:700px;width:840px">💧 น้ำแห้ง<span class="v" style="background:#3b2314">ตัดไฟ</span></div>
    <div class="abs chip" id="s2" style="left:120px;top:860px;width:840px">⬆️ ยกออกจากฐาน<span class="v" style="background:#3b2314">ตัดไฟ</span></div>
    <div class="abs" id="st" style="left:560px;top:330px;width:400px;height:400px;border-radius:50%;border:14px dashed #ff2d87;background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ff2d87">
      <div style="font-weight:700;font-size:48px;line-height:1">ประกัน</div><div style="font-weight:900;font-size:150px;line-height:1">12</div><div style="font-weight:700;font-size:48px;line-height:1.2">เดือน</div></div>
  </div>`);
  return {root:r,update(t,l,e){
    r.querySelector('#sh').style.transform=`scale(${spring(l,0,.5)}) translateX(-120px)`;
    r.querySelector('#s1').style.transform=`translateX(${(1-spring(l,.8,.4))*-1100}px)`;
    r.querySelector('#s2').style.transform=`translateX(${(1-spring(l,1.6,.4))*1100}px)`;
    const s=lin(l,2.7,2.95); r.querySelector('#st').style.transform=`scale(${3-2*eo(s)}) rotate(${-14}deg)`; r.querySelector('#st').style.opacity=s;
  }};
},
cta(){
  const r=el(`<div class="abs" style="inset:0">
    <div class="abs card" id="ck" style="left:570px;top:330px;width:420px;height:540px"><img src="assets/angle.jpg" style="object-position:50% 40%"></div>
    <div class="abs pigc" id="cp" style="left:70px;top:310px;width:520px;height:520px"><img src="assets/pig.webp"></div>
    <div class="abs" id="gift" style="left:470px;top:720px;font-size:150px">🎁</div>
    <div class="abs cart" id="cart" style="left:150px;top:1250px">🛒 กดตะกร้าเลย!</div>
    <div class="abs arrow" id="arr" style="left:40px;top:1360px">👇</div>
  </div>`);
  return {root:r,update(t,l,e){
    r.querySelector('#cp').style.transform=`scale(${spring(l,0,.5)*(1+e*.07)}) rotate(${4+Math.sin(l*9)*e*4}deg)`;
    r.querySelector('#ck').style.transform=`translateX(${(1-spring(l,.25,.5))*600}px) rotate(${6}deg)`;
    r.querySelector('#gift').style.transform=`scale(${spring(l,.9,.45)}) rotate(${Math.sin(l*6)*8}deg)`;
    const c=spring(l,2.6,.45); r.querySelector('#cart').style.transform=`scale(${c*(1+.05*Math.sin(l*10))})`;
    r.querySelector('#arr').style.transform=`translateY(${Math.abs(Math.sin(l*6))*-40}px) scale(${spring(l,2.9,.4)})`;
  }};
}};

const built=TL.scenes.map(s=>{const o=scenes[s.scene]();o.root.style.display='none';S.appendChild(o.root);return o});
const capEls=TL.scenes.map(s=>{const d=el(`<div style="display:none;${s.scene==='cta'?'margin-top:-260px':''}"><div class="l l1">${s.cap[0]}</div><br><div class="l l2">${s.cap[1]}</div></div>`);C.appendChild(d);return d});

window.setTime=function(t){
  const f=Math.min(TL.env.length-1,Math.floor(t*TL.fps)); const e=TL.env[f]||0;
  document.getElementById('prog').style.width=(t/TL.total*1080)+'px';
  TL.scenes.forEach((s,i)=>{
    const on=t>=s.sceneStart&&t<s.sceneEnd; built[i].root.style.display=on?'block':'none'; capEls[i].style.display=on?'block':'none';
    if(!on) return;
    const l=t-s.sceneStart;
    // scene exit: quick zoom-fade over last 0.2s (not for the final scene)
    const out=i<TL.scenes.length-1?lin(t,s.sceneEnd-.2,s.sceneEnd):0;
    built[i].root.style.opacity=1-out; built[i].root.style.transform=`scale(${1+out*.08})`;
    built[i].update(t,l,e);
    const c=capEls[i].children, a=spring(t,s.start,.35), b=spring(t,s.start+.35,.35);
    c[0].style.transform=`scale(${a}) rotate(${i===0?Math.sin(t*30)*3*clamp(1.2-l):0}deg)`;
    c[2].style.transform=`scale(${b})`;
    capEls[i].style.opacity=1-out;
  });
  const big=['hook','cta'].includes(TL.scenes.find(s=>t>=s.sceneStart&&t<s.sceneEnd)?.scene);
  const bd=document.getElementById('badge'); bd.style.opacity=big?0:1;
  document.getElementById('mini').style.transform=`scale(${1+e*.12}) rotate(${Math.sin(t*10)*e*6}deg)`;
};
setTime(0);
</script>
</body></html>
