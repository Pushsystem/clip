<script>
const TL = TIMELINE_JSON;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{const c=1.9;x=clamp(x);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const spring=(t,t0,d=.45)=>t<t0?0:back((t-t0)/d);
const mix=(a,b,k)=>a+(b-a)*k;
const mixP=(p,q,k)=>[mix(p[0],q[0],k),mix(p[1],q[1],k)];
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const show=(id,on)=>{$(id).style.display=on?'':'none'};

// ---------- geometry ----------
const GRIP=[-122,-130], TIP=[195,-188];
const REST={G:[780+GRIP[0],650+GRIP[1]],th:0};
const rot=(v,deg)=>{const a=deg*Math.PI/180;return [v[0]*Math.cos(a)-v[1]*Math.sin(a),v[0]*Math.sin(a)+v[1]*Math.cos(a)]};
const TIPREL=[TIP[0]-GRIP[0],TIP[1]-GRIP[1]];
function pourPose(tx,ty,th){const r=rot(TIPREL,th);return {G:[tx-r[0],ty-r[1]],th}}
function tipOf(p){const r=rot(TIPREL,p.th);return [p.G[0]+r[0],p.G[1]+r[1]]}
function mixPose(a,b,k){return {G:mixP(a.G,b.G,k),th:mix(a.th,b.th,k)}}
function setKettle(p){$('kettle').setAttribute('transform',`translate(${p.G[0]},${p.G[1]}) rotate(${p.th}) translate(${-GRIP[0]},${-GRIP[1]})`)}
function arm(id,cuf,hand,s,h,sag=46){
  const mx=(s[0]+h[0])/2,my=(s[1]+h[1])/2,dx=h[0]-s[0],dy=h[1]-s[1],L=Math.hypot(dx,dy)||1;
  let nx=-dy/L,ny=dx/L; if(ny<0){nx=-nx;ny=-ny}
  $(id).setAttribute('d',`M${s[0]},${s[1]} Q${mx+nx*sag},${my+ny*sag} ${h[0]},${h[1]}`);
  const k=Math.max(0,(L-30)/L);
  $(cuf).setAttribute('cx',s[0]+dx*k);$(cuf).setAttribute('cy',s[1]+dy*k);
  $(hand).setAttribute('cx',h[0]);$(hand).setAttribute('cy',h[1]);
}
function stream(tip,yT,k0,k1){ // k0: head progress, k1: tail progress (0..1)
  if(k0<=0||k1>=1){$('stream').setAttribute('d','');$('streamC').setAttribute('d','');return}
  const x0=tip[0]+4, y0=mix(tip[1]+6,yT,k1), y1=mix(tip[1]+6,yT,k0);
  const d=`M${x0},${y0} Q${x0+6},${(y0+y1)/2} ${x0+4},${y1}`;
  $('stream').setAttribute('d',d);$('streamC').setAttribute('d',d);
}
function steam(id,x,y,t,a,h=110){
  [...$(id).children].forEach((p,i)=>{
    const ph=(t*.7+i/3)%1, yb=y-ph*h, xo=x+(i-1)*22;
    p.setAttribute('d',`M${xo},${yb} q12,-18 0,-34 q-12,-18 0,-34`);
    p.setAttribute('opacity',a*Math.sin(Math.PI*ph)*.85);
  });
}
function callout(on,lab,num,unit='°C',ring=0){
  const c=$('callout'); c.style.display=on>0.001?'':'none';
  c.setAttribute('transform',`translate(900,210) scale(${on})`);
  $('cLab').textContent=lab; $('cNum').textContent=num; $('cUnit').textContent=unit;
  $('cNum').setAttribute('font-size',String(num).length>3?64:84);
  $('cRing').setAttribute('r',116+ring*14); $('cRing').setAttribute('opacity',.3*(1-ring));
}
function setTemp(v,on=1){ $('dispT').textContent=Math.round(v); $('disp').setAttribute('fill',on?'#15161c':'#3a1010'); $('dispT').style.display=on?'':'none';}

// ---------- overlays (HTML, screen coords) ----------
const OV=$('ov'), C=$('cap');
const ov={};
function addOv(id,html){const e=el(html);e.style.display='none';OV.appendChild(e);ov[id]=e;return e}
addOv('spark',`<div class="abs" style="left:780px;top:560px;font-size:90px">✨</div>`);
addOv('t1',`<div class="abs tag" style="left:690px;top:610px">คอห่าน <b>เทนิ่ง</b></div>`);
addOv('t2',`<div class="abs tag" style="left:440px;top:985px">ด้าม<b>ลายไม้</b></div>`);
addOv('t3',`<div class="abs tag" style="left:660px;top:1065px;background:#ff2d87">สไตล์<b style="color:#fff">วินเทจ</b> ✨</div>`);
addOv('photo',`<div class="abs card" style="left:720px;top:290px;width:300px;height:380px"><img src="assets/angle.jpg" style="object-position:50% 40%"><div class="abs tag" style="left:50px;top:300px;font-size:30px;padding:4px 18px 8px">ของจริง 📸</div></div>`);
const SPECS=[['⚡','1200W','เดือดไว'],['💧','0.9 ลิตร','ความจุ'],['🥄','สแตนเลส 304','ด้านใน'],['✅','Food Grade','ปลอดภัย']];
SPECS.forEach(([e,v,k],i)=>addOv('sp'+i,`<div class="abs chip" style="left:${i%2?750:430}px;top:${i<2?285:410}px;width:${i%2?300:300}px"><span class="e">${e}</span><div><div class="v" style="${v.length>8?'font-size:38px':''}">${v}</div><div class="k">${k}</div></div></div>`));
addOv('b1',`<div class="abs bad" style="left:600px;top:980px">⬆️ ยกออก = ตัดไฟ</div>`);
addOv('b2',`<div class="abs bad" style="left:560px;top:1060px">💧 น้ำแห้ง = ตัดไฟ</div>`);
addOv('stamp',`<div class="abs" style="left:700px;top:300px;width:300px;height:300px;border-radius:50%;border:12px dashed #ff2d87;background:rgba(255,255,255,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ff2d87"><div style="font-weight:700;font-size:40px;line-height:1">ประกัน</div><div style="font-weight:900;font-size:120px;line-height:1">12</div><div style="font-weight:700;font-size:40px;line-height:1.2">เดือน</div></div>`);
addOv('cart',`<div class="abs cart" style="left:170px;top:1300px">🛒 กดตะกร้าเลย!</div>`);
addOv('arrow',`<div class="abs" style="left:40px;top:1370px;font-size:150px;line-height:1">👇</div>`);
addOv('photo2',`<div class="abs card" style="left:740px;top:300px;width:260px;height:330px"><img src="assets/front.jpg" style="object-position:50% 40%"></div>`);
function O(id,vis,tf=''){const e=ov[id];e.style.display=vis?'':'none';if(vis)e.style.transform=tf}

const capEls=TL.scenes.map(s=>{const d=el(`<div style="display:none"><div class="l l1">${s.cap[0]}</div><br><div class="l l2">${s.cap[1]}</div></div>`);C.appendChild(d);return d});

// ---------- per-frame state ----------
const IDLE_L=[140,640], IDLE_R=[362,640], KNOB=[850,670];
const DRINK={coffee:{prop:'coffee',from:100,to:92,lab:'กาแฟดริป',y:526,steam:[600,515]},
             tea:{prop:'tea',from:92,to:80,lab:'ชาเขียว',y:614,steam:[600,600]},
             milk:{prop:'milk',from:80,to:45,lab:'นมลูก',y:562,steam:null}};

function render(t){
  const f=Math.min(TL.env.length-1,Math.floor(t*TL.fps)), env=TL.env[f]||0;
  const si=TL.scenes.findIndex(s=>t>=s.sceneStart&&t<s.sceneEnd), S=TL.scenes[si], l=t-S.sceneStart, L=S.sceneEnd-S.sceneStart, p=l/L;
  $('prog').style.width=(t/TL.total*1080)+'px';
  // defaults
  let pig={dx:0,dy:0,sleep:0,jump:0}, hL=[IDLE_L[0],IDLE_L[1]+Math.sin(t*3)*6], hR=[IDLE_R[0],IDLE_R[1]+Math.sin(t*3+1)*6];
  let kp=REST, holding=false, temp=S.scene==='hook'?92:100, dispOn=1;
  ['coffee','tea','milk','clock','gift'].forEach(id=>show(id,false));
  Object.keys(ov).forEach(k=>O(k,false));
  callout(0,'',0); stream(null,0,0,1); steam('steam',0,0,t,0); steam('steam2',0,0,t,0);
  $('nip').style.display=''; $('bottle').removeAttribute('transform'); $('heart').setAttribute('opacity',0);
  $('zzz').setAttribute('opacity',0);
  // window: day by default
  $('sky1').setAttribute('stop-color','#9fd8ff');$('sky2').setAttribute('stop-color','#e8f6ff');$('sun').setAttribute('cy',120);$('moon').setAttribute('opacity',0);

  switch(S.scene){
  case 'hook':{
    const up=spring(l,.05,.6); pig.dy=(1-up)*520;
    hL=[mix(140,95,eo(lin(l,.6,.9))), mix(640,300,eo(lin(l,.6,.9)))+Math.sin(l*14)*18*lin(l,.6,.9)];
    if(l>.6) hL[0]+=Math.sin(l*14)*24;
    O('spark',l>1.6,`scale(${spring(l,1.6,.4)}) rotate(${l*40}deg)`);
    temp=92; break;}
  case 'intro':{
    const pt=eo(lin(l,.2,.6)); hR=mixP(IDLE_R,[560,520],pt);
    O('t1',l>1.7,`scale(${spring(l,1.7,.4)})`); O('t2',l>2.2,`scale(${spring(l,2.2,.4)}) rotate(-3deg)`); O('t3',l>2.7,`scale(${spring(l,2.7,.4)}) rotate(3deg)`);
    O('photo',l>.2&&l<1.7,`scale(${spring(l,.2,.45)*(1-lin(l,1.4,1.7))}) rotate(4deg)`);
    const k=lin(l,3.1,4.6); temp=40+60*eo(k);
    callout(spring(l,2.9,.4),'ปรับได้',Math.round(temp),'°C',(l*1.5)%1);
    break;}
  case 'coffee': case 'tea': case 'milk':{
    const D=DRINK[S.scene]; show(D.prop,true);
    // phases (fractions of the scene)
    const a=lin(p,.02,.12), b=lin(p,.12,.2), set=lin(p,.05,.2);
    temp=mix(D.from,D.to,eio(set));
    callout(spring(p*L,.1,.4)*(1-lin(p,.93,1)),D.lab,Math.round(temp),'°C',(l*1.5)%1);
    // knob reach
    pig.dx=60*Math.sin(Math.PI*lin(p,.02,.22)) - 55*eio(lin(p,.22,.34))*(1-eio(lin(p,.74,.86)));
    if(p<.2) hR=mixP(IDLE_R,KNOB,eio(a)*(1-eio(b)));
    $('knob').setAttribute('transform',`rotate(${-120*eio(set)},850,676)`);
    // lift -> pour -> return
    const POUR=pourPose(600,D.y-120,40);
    const lift=eio(lin(p,.22,.34)), ret=eio(lin(p,.74,.86));
    if(p>=.2&&p<.9){holding=true;
      const wob=Math.sin(l*9)*2*lin(p,.34,.4)*(1-lin(p,.7,.74));
      kp=p<.74?mixPose(REST,{G:POUR.G,th:POUR.th+wob},lift):mixPose(POUR,REST,ret);
      if(p<.24) hR=mixP(IDLE_R,REST.G,eio(lin(p,.2,.24)));
    }
    if(p>=.86) hR=mixP(REST.G,IDLE_R,eio(lin(p,.86,.94)));
    const fill=eo(lin(p,.36,.76));
    stream(tipOf(kp),D.y,lin(p,.34,.39),lin(p,.72,.77));
    if(S.scene==='coffee'){
      const lvl=eo(lin(p,.42,.86))*62; $('cofFill').setAttribute('y',700-lvl);$('cofFill').setAttribute('height',lvl);
      $('grounds').setAttribute('ry',10+6*fill);$('grounds').setAttribute('fill',fill>0?'#4b2a12':'#6b3d1d');
      const dp=(l*2.2)%1; $('drip').setAttribute('cy',mix(600,700-lvl,dp)); $('drip').setAttribute('opacity',p>.4&&p<.9?1:0);
      steam('steam',D.steam[0],D.steam[1],t,lin(p,.45,.6));
    }
    if(S.scene==='tea'){const lvl=fill*70;$('teaFill').setAttribute('y',700-lvl);$('teaFill').setAttribute('height',lvl);steam('steam',D.steam[0],D.steam[1],t,lin(p,.5,.65));}
    if(S.scene==='milk'){
      const lvl=fill*95;$('milkFill').setAttribute('y',700-lvl);$('milkFill').setAttribute('height',lvl);
      const np=spring(p*L,.86*L,.35); $('nip').style.display=p>.86?'':'none';
      $('nip').setAttribute('transform',`translate(0,${(1-np)*-40})`);
      if(p>.9) $('bottle').setAttribute('transform',`rotate(${Math.sin(l*22)*10*lin(p,.9,.94)},600,650)`);
      $('heart').setAttribute('opacity',lin(p,.93,.97)); $('heart').setAttribute('y',560-lin(p,.93,1)*40);
    }
    break;}
  case 'specs':{
    temp=100;
    const at=[.1,1.2,2.2,3.3];
    at.forEach((a,i)=>O('sp'+i,l>a,`scale(${spring(l,a,.4)})`));
    const cur=at.reduce((c,a,i)=>l>a?i:c,0), tgt=[[440,40],[750,40],[440,170],[750,170]][cur];
    hR=mixP(hR,tgt,eo(lin(l,.1,.5)));
    steam('steam2',780+TIP[0]-10,650+TIP[1]-10,t,1,90); steam('steam',780,650-270,t*1.3,.8,80);
    $('disp').setAttribute('fill','#15161c');
    break;}
  case 'keep':{
    const k1=p<.4, sl=lin(p,.32,.4)*(1-lin(p,.74,.8));
    pig.sleep=sl; pig.jump=spring(p*L,.78*L,.35)*(1-lin(p,.86,.95));
    temp=92;
    if(k1) callout(spring(l,.1,.4),'รักษาอุณหภูมิ',92,'°C',(l*1.2)%1);
    else callout(1,'ตั้งเวลา',p<.7?'06:00':'พร้อม!',p<.7?'⏰':'☕',0);
    // night -> dawn
    const n=lin(p,.3,.4)*(1-lin(p,.62,.75)); const dawn=lin(p,.62,.75);
    $('sky1').setAttribute('stop-color',n>.5?'#1e2552':dawn>0?'#ffb37a':'#9fd8ff');$('sky2').setAttribute('stop-color',n>.5?'#3a447e':dawn>0?'#ffe1b8':'#e8f6ff');
    $('sun').setAttribute('cy',mix(120,260,n)); $('moon').setAttribute('opacity',n);
    show('clock',true);
    const ring=p>.7&&p<.86; $('clk').setAttribute('transform',ring?`rotate(${Math.sin(l*60)*9},600,640)`:'');
    $('ring').setAttribute('opacity',ring?1:0);
    steam('steam2',780+TIP[0]-10,650+TIP[1]-10,t,k1?.8:p>.8?.8:0,80);
    $('zzz').setAttribute('opacity',sl);
    $('z1').setAttribute('y',150-((l*40)%40)); $('z2').setAttribute('y',100-((l*30)%30));
    break;}
  case 'safe':{
    const up=eio(lin(p,.05,.18)), dn=eio(lin(p,.42,.55));
    const LIFT={G:[600,390],th:-6};
    if(p<.6){holding=true; kp=p<.42?mixPose(REST,LIFT,up):mixPose(LIFT,REST,dn);}
    if(p<.05) hR=mixP(IDLE_R,REST.G,eio(lin(p,0,.05)));
    if(p>=.55) hR=mixP(REST.G,IDLE_R,eio(lin(p,.55,.62)));
    dispOn=!(p>.12&&p<.5); temp=92;
    O('b1',p>.12,`translateX(${(1-spring(l,.12*L,.4))*600}px)`);
    O('b2',p>.45,`translateX(${(1-spring(l,.45*L,.4))*-700}px)`);
    const s=lin(p,.72,.78); O('stamp',p>.72,`scale(${3-2*eo(s)}) rotate(-12deg)`); ov.stamp.style.opacity=s;
    break;}
  case 'cta':{
    show('gift',true); temp=92;
    const g=spring(l,.1,.5); $('gift').setAttribute('transform',`translate(0,${(1-g)*300}) rotate(${Math.sin(l*5)*3},250,620)`);
    hL=[180,620+(1-g)*300]; hR=[320,620+(1-g)*300];
    O('photo2',l>.6,`scale(${spring(l,.6,.45)}) rotate(5deg)`);
    O('cart',l>1.6,`scale(${spring(l,1.6,.45)*(1+.05*Math.sin(l*10))})`);
    O('arrow',l>1.9,`translateY(${Math.abs(Math.sin(l*6))*-40}px) scale(${spring(l,1.9,.4)})`);
    O('spark',true,`scale(${spring(l,.3,.4)}) rotate(${l*40}deg)`);
    break;}
  }
  // pig body & head
  const bob=Math.sin(t*3)*4, jumpY=-pig.jump*60;
  $('pig').setAttribute('transform',`translate(${pig.dx},${pig.dy+bob+jumpY})`);
  const talk=pig.sleep>.5?0:env;
  const hr=Math.sin(t*7)*talk*4 + pig.sleep*14;
  $('head').setAttribute('transform',`rotate(${hr},250,440)`);
  $('brows').setAttribute('transform',`translate(0,${-talk*8 - pig.jump*10})`);
  const open=talk>.06; $('mouthO').style.display=open?'':'none'; $('mouthC').style.display=open?'none':'';
  $('mo').setAttribute('ry',4+talk*18); $('tg').setAttribute('cy',412+talk*8);
  // kettle + arms
  setKettle(kp); if(holding) hR=kp.G;
  setTemp(temp,dispOn);
  const off=[pig.dx,pig.dy+bob+jumpY];
  const sL=[165+off[0],480+off[1]], sR=[335+off[0],480+off[1]];
  if(S.scene==='hook') hL=[hL[0]+off[0],hL[1]+off[1]];
  arm('armL','cufL','hL',sL,hL,-40); arm('armR','cufR','hR',sR,hR,40);
  // captions
  TL.scenes.forEach((s,i)=>{capEls[i].style.display=i===si?'block':'none'});
  const c=capEls[si].children, a1=spring(t,S.start,.35), a2=spring(t,S.start+.35,.35);
  c[0].style.transform=`scale(${a1}) rotate(${si===0?Math.sin(t*30)*3*clamp(1.2-l):0}deg)`; c[2].style.transform=`scale(${a2})`; c[2].style.display=S.scene==='cta'?'none':'';
  // badge
  $('badge').style.opacity=S.scene==='hook'||S.scene==='cta'?0:1;
  $('mini').style.transform=`scale(${1+env*.12}) rotate(${Math.sin(t*10)*env*6}deg)`;
}
window.setTime=render;
render(0);
</script>
</body></html>
