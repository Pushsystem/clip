<!doctype html>
<html><head><meta charset="utf-8"><title>Morihan Unryu</title>
<style>
@font-face{font-family:IT;src:url(fonts/Itim-Regular.ttf);font-display:block}
@font-face{font-family:CB;src:url(fonts/Caveat-Bold.ttf);font-display:block}
@font-face{font-family:ZK;src:url(fonts/ZenKurenaido-subset.ttf);font-display:block}
@font-face{font-family:SB;src:url(fonts/Sarabun-SemiBold.ttf);font-display:block}
html,body{margin:0;background:#f3eadb;overflow:hidden}
canvas{display:block}

<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Morihan Unryu · "มังกรเมฆ" — a 31.5 s vertical Tablet Sketch Explainer (TikTok, 1080×1920, 24 fps).
// Engine (pencil brush, colour blocks, lettering, composite, camera, stylus) adapted from the Lemo-Opuscar
// ipad-sketch demo; the page, timeline, camera path and Thai lettering are this film's own.
// ?clean=1 hides the stylus and subtitles (stills).
const W = 1080, H = 1920, FPS = 24, FULL = 31.5;
const QS = new URLSearchParams(location.search);
const FROM = +(QS.get('from') ?? 0), TO = +(QS.get('to') ?? FULL), CLEAN = QS.get('clean') === '1';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- canvas domain (world units) and buffer resolution: one tall page 1300 × 3200 ----------
const X0 = -80, Y0 = -80, DW = 1460, DH = 3620, S = 1.6;
const BW = Math.round(DW * S), BH = Math.round(DH * S);
const PX = x => (x - X0) * S, PY = y => (y - Y0) * S;

// ---------- palette ----------
const hex = c => [parseInt(c.slice(1, 3), 16) / 255, parseInt(c.slice(3, 5), 16) / 255, parseInt(c.slice(5, 7), 16) / 255];
const C = {
  paper: '#f3eadb', graphite: '#43362e', light: '#a8998a', coral: '#dc6a4c', mustard: '#f1c04f',
  can: '#2f2a29', canTop: '#4a4442', cloud: '#d3d8d6', matcha: '#86b24f', matchaDk: '#5f8f3e', leaf: '#7fa860', leafDk: '#5c8748',
  bush: '#a9c48a', stone: '#b9b2a6', wood: '#c39a6b', pink: '#e7a3a8', silk: '#c6dba0', olive: '#6f7a3e',
  bowl: '#7d6a5b', latte: '#a3c769', glass: '#dfe8e4'
};
